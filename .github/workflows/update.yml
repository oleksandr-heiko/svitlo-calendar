name: Оновити календарі
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: svitlo, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      # запланований запуск інакше бере коміт на момент постановки в чергу,
      # і push state.json падає, якщо попередній запуск уже закомітив новіший
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -I svitlo.py
      - name: Зберегти state.json
        run: |
          git config user.name "svitlo-bot"
          git config user.email "svitlo-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Оновлення графіка" && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      # GitHub Pages інколи разово не бачить артефакт — пробуємо ще раз
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
